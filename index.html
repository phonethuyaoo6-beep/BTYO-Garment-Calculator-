<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTYO Garment Calculator</title>
<style>
body {
  font-family: sans-serif;
  background: #f2f4f7;
  margin: 0;
  padding: 20px;
}
.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 15px;
}
h1 {
  text-align: center;
  color: #087f5b;
}
input, button {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  box-sizing: border-box;
  font-size: 16px;
  border-radius: 8px;
}
input {
  border: 1px solid #ccc;
}
button {
  background: #087f5b;
  color: white;
  border: none;
}
.result {
  background: #e8f5e9;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
}
</style>
</head>
<body>
<div class="container">
<h1>BTYO Garment Calculator</h1>
<p>အထည်ချုပ်လုပ်ငန်း အထည်တွက်ချက်မှု</p>

<label>အထည်အရေအတွက်</label>
<input type="number" id="qty" placeholder="အထည်အရေအတွက်">

<label>တစ်ထည်အတွက် အသားပမာဏ (ကိုက်)</label>
<input type="number" id="yard" step="0.01" placeholder="ကိုက်ပမာဏ">

<label>တစ်ကိုက်ဈေးနှုန်း (ကျပ်)</label>
<input type="number" id="price" placeholder="ဈေးနှုန်း">

<button onclick="calculate()">တွက်ချက်မည်</button>

<div class="result" id="result">
တွက်ချက်မှုရလဒ် ပေါ်လာမည်
</div>
</div>

<script>
function calculate() {
  let qty = Number(document.getElementById("qty").value);
  let yard = Number(document.getElementById("yard").value);
  let price = Number(document.getElementById("price").value);

  let totalYard = qty * yard;
  let totalCost = totalYard * price;

  document.getElementById("result").innerHTML =
    "စုစုပေါင်းအထည် = " + qty + " ထည်<br>" +
    "စုစုပေါင်းအသား = " + totalYard.toFixed(2) + " ကိုက်<br>" +
    "စုစုပေါင်းကုန်ကျငွေ = " + totalCost.toLocaleString() + " ကျပ်";
}
</script>
</body>
</html>
